name: OpenWrt Builder mt7621 OPTIMIZED

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  VERSION: 24.10.4
  CPU: mt7621
  BOARD: ramips
  TZ: Asia/Jakarta
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # ⚡ SETUP CEPAT
    - name: Initialization environment
      run: |
        sudo apt-get update -qq
        sudo apt-get install -yq \
          build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev \
          libssl-dev python3 python3-pyelftools rsync unzip zlib1g-dev \
          file wget ccache

        sudo timedatectl set-timezone "$TZ"

    # ⚡ TAMBAH SWAP (ANTI OOM)
    - name: Add swap
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
    
        sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
    
        free -h

    # ⚡ CLONE SUPER CEPAT
    - name: Clone source
      run: |
        git clone --depth 1 --branch v$VERSION $REPO_URL openwrt

    # ⚡ CACHE (WAJIB BIAR CEPAT)
    - name: Cache OpenWrt
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          openwrt/build_dir
          openwrt/staging_dir
          ~/.ccache
        key: ${{ runner.os }}-openwrt-${{ env.VERSION }}-${{ hashFiles('openwrt/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-${{ env.VERSION }}-

    # ⚡ FEEDS
    - name: Update & install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ⚡ LOAD CONFIG
    - name: Load config
      run: |
        cd openwrt
        wget https://downloads.immortalwrt.org/releases/$VERSION/targets/$BOARD/$CPU/config.buildinfo -O .config
        echo "CONFIG_CCACHE=y" >> .config
        make defconfig

    # ⚡ DOWNLOAD
    - name: Download packages
      run: |
        cd openwrt
        make download -j$(nproc)

    # 🔥 COMPILE (AMAN + CEPAT)
    - name: Compile firmware
      id: compile
      run: |
        cd openwrt
        echo "Using 2 threads (safe mode)"
        make -j2 V=s

        echo "status=success" >> $GITHUB_OUTPUT

        DEVICE=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/')
        echo "DEVICE_NAME=_${DEVICE}" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    # ⚡ ORGANIZE FILE (FIX PATH TANPA WILDCARD)
    - name: Organize firmware
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/ramips/mt7621
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    # 📦 UPLOAD ARTIFACT
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # 🚀 RELEASE
    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true'
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        files: ${{ env.FIRMWARE }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: OpenWrt Kernel Builder FAST

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  VERSION: 24.10.4
  BOARD: ramips
  CPU: mt7621

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # ⚡ SETUP MINIMAL
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -yq \
          build-essential flex bison g++ gawk \
          libncurses-dev libssl-dev python3 rsync unzip file wget

    # ⚡ CLONE CEPAT
    - name: Clone source
      run: |
        git clone --depth 1 --branch v$VERSION $REPO_URL openwrt

    # ⚡ CACHE (WAJIB BIAR CEPAT)
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
        key: kernel-${{ env.VERSION }}

    # ⚡ FEEDS (minimal)
    - name: Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ⚡ CONFIG
    - name: Load config
      run: |
        cd openwrt
        wget https://downloads.immortalwrt.org/releases/$VERSION/targets/$BOARD/$CPU/config.buildinfo -O .config
        make defconfig

    # 🔥 BUILD KERNEL ONLY
    - name: Compile kernel only
      run: |
        cd openwrt
        make target/linux/clean
        make target/linux/compile -j2 V=s

    # 📦 AMBIL HASIL KERNEL
    - name: Collect kernel
      run: |
        cd openwrt/bin/targets/ramips/mt7621
        ls -lah
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload kernel files
      uses: actions/upload-artifact@v4
      with:
        name: kernel-mt7621
        path: ${{ env.FIRMWARE }}
